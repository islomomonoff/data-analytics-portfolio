<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chipta Narxi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;900&family=Righteous&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3ee;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe0b2 0%, transparent 70%);
            top: -150px; right: -150px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, #e8f5e9 0%, transparent 70%);
            bottom: -100px; left: -100px;
            pointer-events: none;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            animation: slideDown 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }
        .header-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #ff9a3c, #ff6b35);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: 0 auto 14px;
            box-shadow: 0 12px 30px rgba(255,107,53,0.35);
        }
        .header h1 {
            font-family: 'Righteous', cursive;
            font-size: 28px;
            color: #2d1f0e;
            letter-spacing: 0.5px;
        }
        .header p {
            color: #9e8a78;
            font-size: 14px;
            font-weight: 400;
            margin-top: 4px;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 30px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s both;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: #b0a090;
            margin-bottom: 12px;
        }

        .age-input-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .age-display {
            width: 100%;
            background: #faf7f3;
            border: 2px solid #ede8e0;
            border-radius: 16px;
            padding: 18px 20px 18px 60px;
            font-size: 30px;
            font-weight: 900;
            font-family: 'Righteous', cursive;
            color: #2d1f0e;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield;
        }
        .age-display::-webkit-inner-spin-button,
        .age-display::-webkit-outer-spin-button { display: none; }
        .age-display:focus {
            border-color: #ff9a3c;
            box-shadow: 0 0 0 4px rgba(255,154,60,0.15);
        }
        .age-input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }
        .age-unit {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 600;
            color: #b0a090;
        }

        .slider-wrap { margin-bottom: 26px; }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff9a3c 0%, #ede8e0 0%);
            outline: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px; height: 24px;
            background: white;
            border: 3px solid #ff9a3c;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(255,107,53,0.3);
            transition: transform 0.15s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
        }
        .slider-labels span { font-size: 11px; color: #b0a090; font-weight: 600; }

        .cats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 26px;
        }
        .cat {
            border-radius: 14px;
            padding: 14px;
            border: 2px solid #ede8e0;
            background: #faf7f3;
            transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
        }
        .cat .cat-icon { font-size: 22px; margin-bottom: 6px; display: block; }
        .cat .cat-range {
            font-size: 11px; font-weight: 700; color: #b0a090;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;
        }
        .cat .cat-price { font-size: 15px; font-weight: 900; color: #2d1f0e; }

        .cat.active-free   { border-color: #43a047; background: #f1f8e9; }
        .cat.active-youth  { border-color: #fb8c00; background: #fff8e1; }
        .cat.active-adult  { border-color: #1e88e5; background: #e3f2fd; }
        .cat.active-senior { border-color: #8e24aa; background: #f3e5f5; }
        .cat.active-free   .cat-range { color: #43a047; }
        .cat.active-youth  .cat-range { color: #fb8c00; }
        .cat.active-adult  .cat-range { color: #1e88e5; }
        .cat.active-senior .cat-range { color: #8e24aa; }

        .btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #ff9a3c, #ff6b35);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(255,107,53,0.35);
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,107,53,0.45); }
        .btn:active { transform: translateY(0); }

        .result {
            display: none;
            margin-top: 20px;
            animation: popIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }

        .ticket {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0,0,0,0.12);
        }
        .ticket-top {
            padding: 24px 24px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ticket-emoji-wrap {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
        }
        .ticket-category {
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 4px;
        }
        .ticket-price {
            font-family: 'Righteous', cursive;
            font-size: 32px; color: white; line-height: 1;
        }

        .ticket-divider {
            position: relative;
            height: 1px;
            margin: 0 24px;
            border-top: 2px dashed rgba(255,255,255,0.25);
        }
        .ticket-divider .cl, .ticket-divider .cr {
            width: 20px; height: 20px; border-radius: 50%;
            background: #f7f3ee;
            position: absolute; top: 50%;
        }
        .ticket-divider .cl { left: -34px; transform: translateY(-50%); }
        .ticket-divider .cr { right: -34px; transform: translateY(-50%); }

        .ticket-bottom {
            padding: 14px 24px 20px;
            background: rgba(0,0,0,0.12);
        }
        .ticket-bottom .tmsg { color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; }
        .ticket-bottom .tage { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 2px; }

        .theme-free   { background: linear-gradient(135deg, #43a047, #2e7d32); }
        .theme-youth  { background: linear-gradient(135deg, #fb8c00, #e65100); }
        .theme-adult  { background: linear-gradient(135deg, #1e88e5, #1565c0); }
        .theme-senior { background: linear-gradient(135deg, #8e24aa, #6a1b9a); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div class="header-icon">🎫</div>
        <h1>Chipta Narxi</h1>
        <p>Yoshingizni kiriting — narxni bilib oling</p>
    </div>

    <div class="card">
        <div class="section-label">Yoshingiz</div>

        <div class="age-input-wrap">
            <span class="age-input-icon">🎂</span>
            <input class="age-display" type="number" id="yoshInput"
                placeholder="0" min="0" max="120" oninput="onInput()">
            <span class="age-unit">yosh</span>
        </div>

        <div class="slider-wrap">
            <input type="range" id="yoshSlider" min="0" max="100" value="0" oninput="onSlider()">
            <div class="slider-labels">
                <span>0</span><span>25</span><span>50</span><span>75</span><span>100+</span>
            </div>
        </div>

        <div class="section-label">Kategoriyalar</div>
        <div class="cats">
            <div class="cat" id="cat0">
                <span class="cat-icon">👶</span>
                <div class="cat-range">0 – 5 yosh</div>
                <div class="cat-price">Bepul 🎁</div>
            </div>
            <div class="cat" id="cat1">
                <span class="cat-icon">🧒</span>
                <div class="cat-range">6 – 17 yosh</div>
                <div class="cat-price">15 000 so'm</div>
            </div>
            <div class="cat" id="cat2">
                <span class="cat-icon">🧑</span>
                <div class="cat-range">18 – 59 yosh</div>
                <div class="cat-price">25 000 so'm</div>
            </div>
            <div class="cat" id="cat3">
                <span class="cat-icon">👴</span>
                <div class="cat-range">60+ yosh</div>
                <div class="cat-price">12 000 so'm</div>
            </div>
        </div>

        <button class="btn" onclick="hisobla()">🎟 Chipta narxini ko'rish</button>

        <div class="result" id="result">
            <div class="ticket" id="ticket">
                <div class="ticket-top">
                    <div class="ticket-emoji-wrap" id="tEmoji"></div>
                    <div>
                        <div class="ticket-category" id="tCat"></div>
                        <div class="ticket-price" id="tPrice"></div>
                    </div>
                </div>
                <div class="ticket-divider">
                    <div class="cl"></div><div class="cr"></div>
                </div>
                <div class="ticket-bottom">
                    <div class="tmsg" id="tMsg"></div>
                    <div class="tage" id="tAge"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const slider = document.getElementById('yoshSlider');
    const input  = document.getElementById('yoshInput');

    function updateFill(v) {
        const pct = Math.min(v, 100);
        slider.style.background = `linear-gradient(90deg, #ff9a3c ${pct}%, #ede8e0 ${pct}%)`;
    }

    function highlightCat(y) {
        ['cat0','cat1','cat2','cat3'].forEach((id,i) => {
            document.getElementById(id).classList.remove('active-free','active-youth','active-adult','active-senior');
        });
        if (isNaN(y)) return;
        if      (y < 6)  document.getElementById('cat0').classList.add('active-free');
        else if (y <= 17) document.getElementById('cat1').classList.add('active-youth');
        else if (y <= 59) document.getElementById('cat2').classList.add('active-adult');
        else              document.getElementById('cat3').classList.add('active-senior');
    }

    function onInput() {
        const v = parseInt(input.value);
        if (!isNaN(v)) { slider.value = Math.min(v,100); updateFill(Math.min(v,100)); }
        highlightCat(v);
        document.getElementById('result').style.display = 'none';
    }

    function onSlider() {
        input.value = slider.value;
        updateFill(slider.value);
        highlightCat(parseInt(slider.value));
        document.getElementById('result').style.display = 'none';
    }

    function hisobla() {
        const y = parseInt(input.value);
        if (isNaN(y) || y < 0 || y > 120) { alert("Iltimos, to'g'ri yosh kiriting!"); return; }

        let theme, emoji, cat, price, msg;
        if (y < 6)       { theme='theme-free';   emoji='🎁'; cat='Bola (0–5 yosh)';      price='BEPUL!';        msg='Siz uchun chipta tekin'; }
        else if (y<=17)  { theme='theme-youth';  emoji='🧒'; cat="O'smir (6–17 yosh)";   price="15 000 so'm";   msg="Imtiyozli narxdan foydalanasiz"; }
        else if (y<=59)  { theme='theme-adult';  emoji='🧑'; cat='Kattalar (18–59 yosh)'; price="25 000 so'm";   msg='Standart chipta narxi'; }
        else             { theme='theme-senior'; emoji='👴'; cat='Keksalar (60+ yosh)';   price="12 000 so'm";   msg="Imtiyozli keksa narxi"; }

        document.getElementById('ticket').className = `ticket ${theme}`;
        document.getElementById('tEmoji').textContent = emoji;
        document.getElementById('tCat').textContent   = cat;
        document.getElementById('tPrice').textContent = price;
        document.getElementById('tMsg').textContent   = msg;
        document.getElementById('tAge').textContent   = `Kiritilgan yosh: ${y} yosh`;

        const res = document.getElementById('result');
        res.style.display = 'block';
        res.style.animation = 'none';
        res.offsetHeight;
        res.style.animation = '';
        res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    input.addEventListener('keydown', e => { if (e.key==='Enter') hisobla(); });
</script>
</body>
</html>
